<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniGPT</title>

  <!-- Cascading Sytle Sheet Added -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="new-chat-btn" id="newChatBtn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="{1.5}"
            stroke="currentColor" className="size-6">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          New Chat
        </button>
      </div>

      <div class="chat-history" id="chatHistory"></div>
      <!-- Js will inject past conversation items here, e.g.
   <div class="history-item active">
    <span class="history-title">Untitled chat</span>
    <button class="history-delete">X</button>
    <div> -->
      <p class="history-empty" id="historyEmpty">No Conversations yet</p>
  </div>

  <div class="sidebar-bottom">
    <button class="sidebar-btn" id="apiKeyBtn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#000000">
        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
        <g id="SVGRepo_iconCarrier">
          <path
            d="M21.3,19a2.42,2.42,0,0,1-2.5.56l-2.35,2.35a.34.34,0,0,1-.49,0l-1-1a.36.36,0,0,1,0-.49l2.36-2.35a2.39,2.39,0,0,1,3.39-2.91L19.12,16.8l1,1,1.62-1.62A2.39,2.39,0,0,1,21.3,19ZM22,8v5.76A4.47,4.47,0,0,0,19.5,13a4.57,4.57,0,0,0-1.29.19V9.29H16.66V14A4.5,4.5,0,0,0,15,17.5a4.07,4.07,0,0,0,0,.5H4a2,2,0,0,1-2-2V8A2,2,0,0,1,4,6H20A2,2,0,0,1,22,8ZM11,15,9.09,9.27H7L5.17,15h1.7l.29-1.07H9L9.29,15Zm4.77-3.89a1.67,1.67,0,0,0-.55-1.35,2.43,2.43,0,0,0-1.62-.47h-2V15h1.54V13.11h.44a2.75,2.75,0,0,0,1-.17,1.82,1.82,0,0,0,.67-.44,1.63,1.63,0,0,0,.36-.64A2.36,2.36,0,0,0,15.75,11.11Zm-7.3.62-.12-.44-.15-.58c0-.21-.08-.37-.11-.5a4.63,4.63,0,0,1-.1.48c0,.19-.08.38-.13.57s-.08.34-.12.47l-.24.93H8.69Zm5.59-1a.63.63,0,0,0-.5-.17h-.4v1.31h.31a.9.9,0,0,0,.37-.07.59.59,0,0,0,.27-.22.75.75,0,0,0,.11-.42A.57.57,0,0,0,14,10.71Z">
          </path>
          <rect width="24" height="24" fill="none"></rect>
        </g>
      </svg>API Settings
    </button>
  </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="main">

    <header class="main-header">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_iconCarrier">
            <path
              d="M8 10.5H16M8 14.5H11M21.0039 12C21.0039 16.9706 16.9745 21 12.0039 21C9.9675 21 3.00463 21 3.00463 21C3.00463 21 4.56382 17.2561 3.93982 16.0008C3.34076 14.7956 3.00391 13.4372 3.00391 12C3.00391 7.02944 7.03334 3 12.0039 3C16.9745 3 21.0039 7.02944 21.0039 12Z"
              stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </g>
        </svg>
      </button>

      <select class="model-select" id="modelSelect">
        <option value="gpt-4o">GPT-4o</option>
        <option value="gpt-4o-mini">GPT-4o mini</option>
        <option value="gpt-4-turbo">GPT-4 Turbo</option>
        <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
      </select>
    </header>

    <!-- Messages -->
    <section class="chat-window" id="chatWindow">
      <div class="empty-state" id="emptyState">
        <h1>What can I help with?</h1>
        <div class="suggestions">
          <button class="suggestion-card">Explain a concept simply</button>
          <button class="suggestion-card">Write and debug code</button>
          <button class="suggestion-card">Brainstorm ideas</button>
          <button class="suggestion-card">Summarize a document</button>
        </div>
      </div>

      <div class="messages" id="messages">
        <!-- JS will inject messages here, e.g.
        <div class="message-user">
          <div class="avatar">U</div>
          <div class="message-content">Hello!</div>
        </div>

        <div class="message assistant">
          <div class="avatar">AI</div>
          <div class="message-content">Hi, How can I help?</div>
        </div> -->
      </div>
    </section>

    <!-- Input Bar -->
    <footer class="input-area">
      <form class="input-form" id="chatForm">
        <textarea id="userInput" class="user-input" placeholder="Message ChatBot..." rows="1"
          autocomplete="off"></textarea>
        <button type="submit" class="send-btn" id="sendBtn" disabled aria-label="Send message">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
          </svg>

        </button>
      </form>
      <p class="disclaimer">AI can make mistakes. Check important info.</p>
    </footer>

  </main>
  </div>

  <!-- API Key Modal -->
  <div class="madal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>API Settings</h2>
      <label for="apiKeyInput">OpenAI API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk..." autocomplete="off">
      <p class="modal-hint">Stored only in your browser (localstorage). Never shared.</p>
      <div class="modal-actions">
        <button class="modal-btn secondary" id="modalCancel">Cancel</button>
        <button class="modal-btn primary" id="modalSave">Save</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Added -->
  <script src="script.js"></script>
</body>

</html>
